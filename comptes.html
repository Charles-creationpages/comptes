<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Porteclefs</title>
<style>
  :root{
    --bg:#F5F2EB; --card:#FFFFFF; --line:#E7E1D4; --ink:#231F18; --muted:#8C8474; --faint:#B4AC9C;
    --accent:#234A3A; --accent2:#2E5A47; --on-accent:#F6F3EC;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .serif{font-family:Georgia,'Times New Roman',serif;}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  header{padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand .mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;}
  .brand .mark svg{width:18px;height:18px;}
  .brand h1{font-size:22px;margin:0;letter-spacing:.02em;}
  .brand p{margin:1px 0 0;font-size:11.5px;color:var(--muted);}
  .hbtns{display:flex;gap:8px;}
  .iconbtn2{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;}
  .iconbtn2 svg{width:17px;height:17px;}

  .nav{display:flex;gap:8px;overflow-x:auto;padding:6px 20px 14px;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:9px 15px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .chip .dot{width:8px;height:8px;border-radius:99px;}
  .chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
  .chip.on .dot{background:var(--on-accent)!important;}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 16px 40px;}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;min-height:158px;display:flex;flex-direction:column;cursor:pointer;text-align:left;font-family:inherit;color:inherit;}
  .tile .ti{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;}
  .tile .ti svg{width:22px;height:22px;}
  .tile h2{font-size:19px;margin:14px 0 2px;}
  .tile .tsub{font-size:12px;color:var(--muted);}
  .tile .cnt{margin-top:auto;padding-top:12px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .tile .cnt svg{width:15px;height:15px;}

  .list{padding:2px 16px 100px;display:flex;flex-direction:column;gap:10px;}
  .lhead{margin:2px 4px 2px;}
  .lhead h3{margin:0;font-size:16px;font-weight:500;}
  .lhead .note{margin:6px 0 8px;font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.45;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;}
  .top{display:flex;align-items:flex-start;gap:12px;}
  .ibox{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;}
  .ibox svg{width:19px;height:19px;}
  .info{min-width:0;flex:1;}
  .svcrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .svc{font-size:15.5px;font-weight:500;}
  .ttag{font-size:11.5px;color:var(--faint);margin-top:2px;}
  .wait{font-size:10.5px;font-weight:500;color:#9A7B4A;background:#F0E6D5;border-radius:99px;padding:2px 8px;}
  .edit{width:34px;height:34px;flex-shrink:0;border:none;background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer;border-radius:9px;}
  .edit:active{background:var(--bg);}
  .edit svg{width:16px;height:16px;}
  .rows{margin-top:10px;display:flex;flex-direction:column;}
  .r{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);}
  .r .lbl{width:88px;font-size:12px;color:var(--muted);flex-shrink:0;}
  .r .val{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .r .val.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.02em;}
  .r .todo{color:var(--faint);font-style:italic;cursor:pointer;}
  .tap{width:38px;height:38px;flex-shrink:0;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;border-radius:9px;}
  .tap:active{background:var(--bg);}
  .tap svg{width:17px;height:17px;}
  .tap.ok{color:var(--accent);}

  .addbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 72%,transparent);}
  .add{width:100%;border:none;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:16px;font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:inherit;}
  .add svg{width:19px;height:19px;}

  .gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .gate-card{width:100%;max-width:360px;}
  .gate-icon{width:52px;height:52px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto 18px;}
  .gate-icon svg{width:24px;height:24px;}
  .gate h1{font-size:22px;text-align:center;margin:0;}
  .gate p{color:var(--muted);font-size:13.5px;text-align:center;line-height:1.5;margin:8px 0 0;}
  .gate .stack{margin-top:22px;display:flex;flex-direction:column;gap:10px;}
  .field{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;outline:none;font-family:inherit;font-size:16px;padding:13px 14px;width:100%;}
  .field::placeholder{color:var(--faint);}
  .field:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(35,74,58,.12);}
  .btn-accent{background:var(--accent);color:var(--on-accent);border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-accent:disabled{opacity:.5;}
  .linklike{background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:6px 0 0;font-family:inherit;}
  .err{color:#B4453A;font-size:13px;text-align:center;margin:2px 0 0;}

  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(35,31,24,.4);}
  .sheet{background:var(--bg);border-top-left-radius:22px;border-top-right-radius:22px;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;padding:8px 20px calc(20px + env(safe-area-inset-bottom));}
  .grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 12px;}
  .sheet h3{margin:0 0 14px;font-size:19px;}
  .f{margin-bottom:12px;}
  .f label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .sheet-foot{display:flex;gap:10px;margin-top:6px;}
  .sheet-foot .btn-accent{flex:1;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;font-weight:500;cursor:pointer;font-family:inherit;}
  .del-link{background:none;border:none;color:#B4453A;font-size:13.5px;cursor:pointer;font-family:inherit;padding:12px 0 2px;display:block;margin:0 auto;}
</style>
</head>

var STORE_KEY="porteclefs:vault:v1";

function svg(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pending(a){return !a.login && !a.password;}

// ————— Chiffrement —————
var encoder=new TextEncoder(),decoder=new TextDecoder();
function b64(buf){var b=new Uint8Array(buf),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function unb64(str){return Uint8Array.from(atob(str),function(c){return c.charCodeAt(0);});}
function deriveKey(pw,salt){return crypto.subtle.importKey("raw",encoder.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);});}
function encryptJSON(key,obj){var iv=crypto.getRandomValues(new Uint8Array(12));return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,encoder.encode(JSON.stringify(obj))).then(function(ct){return{iv:b64(iv),ct:b64(ct)};});}
function decryptJSON(key,iv,ct){return crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(iv)},key,unb64(ct)).then(function(pt){return JSON.parse(decoder.decode(pt));});}

// ————— État —————
var screen="loading",stored=null,saltB64="",masterKey=null,accounts=[];
var view="home",revealed={},copied="";
var root=document.getElementById("root");
var cryptoOK=!!(window.crypto&&crypto.subtle&&crypto.subtle.deriveKey);

function persist(next){accounts=next;if(!masterKey)return;encryptJSON(masterKey,next).then(function(e){localStorage.setItem(STORE_KEY,JSON.stringify({salt:saltB64,iv:e.iv,ct:e.ct}));});}
function count(e){return accounts.filter(function(a){return a.entity===e;}).length;}
function doCopy(text,tag){if(navigator.clipboard&&text)navigator.clipboard.writeText(text);copied=tag;render();setTimeout(function(){copied="";render();},900);}

// ————— Écrans coffre —————
function renderGate(mode){
  var setup=mode==="setup";
  root.innerHTML='<div class="gate"><div class="gate-card">'+
    '<div class="gate-icon">'+svg(P.lock)+'</div>'+
    '<h1 class="serif">'+(setup?"Créez votre mot de passe maître":"Porteclefs verrouillé")+'</h1>'+
    '<p>'+(setup?"Il chiffre tout le trousseau. Impossible à récupérer si vous l\'oubliez — conservez-le en lieu sûr.":"Entrez votre mot de passe maître.")+'</p>'+
    '<div class="stack">'+
      '<input class="field" id="pw" type="password" placeholder="Mot de passe maître" autofocus />'+
      (setup?'<input class="field" id="pw2" type="password" placeholder="Confirmez" />':'')+
      '<p class="err" id="err" style="display:none"></p>'+
      '<button class="btn-accent" id="go">'+(setup?"Créer le trousseau":"Déverrouiller")+'</button>'+
      '<button class="linklike" id="importLink" type="button">Importer une sauvegarde (.vault)…</button>'+
    '</div></div></div>';
  var pw=document.getElementById("pw"),pw2=document.getElementById("pw2"),go=document.getElementById("go"),err=document.getElementById("err");
  function showErr(m){err.textContent=m;err.style.display="block";}
  function submit(){
    err.style.display="none";
    if(!cryptoOK)return showErr("Chiffrement indisponible : ouvrez la page en https.");
    if(pw.value.length<8)return showErr("8 caractères minimum.");
    if(setup&&pw.value!==pw2.value)return showErr("Les deux saisies diffèrent.");
    go.disabled=true;go.textContent="…";
    if(setup){var salt=crypto.getRandomValues(new Uint8Array(16));deriveKey(pw.value,salt).then(function(key){return encryptJSON(key,SEED).then(function(e){saltB64=b64(salt);masterKey=key;accounts=SEED.slice();localStorage.setItem(STORE_KEY,JSON.stringify({salt:saltB64,iv:e.iv,ct:e.ct}));screen="app";view="home";render();});}).catch(function(){go.disabled=false;go.textContent="Créer le trousseau";showErr("Erreur au chiffrement.");});}
    else{deriveKey(pw.value,unb64(stored.salt)).then(function(key){return decryptJSON(key,stored.iv,stored.ct).then(function(data){masterKey=key;saltB64=stored.salt;accounts=data;screen="app";view="home";render();});}).catch(function(){go.disabled=false;go.textContent="Déverrouiller";showErr("Mot de passe incorrect.");});}
  }
  go.onclick=submit;
  [pw,pw2].forEach(function(el){if(el)el.addEventListener("keydown",function(e){if(e.key==="Enter")submit();});});
  document.getElementById("importLink").onclick=function(){
    var inp=document.createElement("input");inp.type="file";inp.accept=".vault,.json,application/json";
    inp.onchange=function(){var file=inp.files[0];if(!file)return;var rd=new FileReader();rd.onload=function(){try{var d=JSON.parse(rd.result);if(!d.salt||!d.iv||!d.ct)throw 0;if(localStorage.getItem(STORE_KEY)&&!confirm("Remplacer le trousseau déjà présent ?"))return;localStorage.setItem(STORE_KEY,JSON.stringify({salt:d.salt,iv:d.iv,ct:d.ct}));stored=d;renderGate("unlock");}catch(e){showErr("Fichier de sauvegarde invalide.");}};rd.readAsText(file);};
    inp.click();
  };
}

// ————— App —————
function mountApp(){
  root.innerHTML='<div class="wrap">'+
    '<header><div class="brand"><div class="mark">'+svg(P.lock)+'</div><div><h1 class="serif">Porteclefs</h1><p>Trousseau chiffré</p></div></div>'+
    '<div class="hbtns"><button class="iconbtn2" id="exportBtn" aria-label="Exporter">'+svg(P.download)+'</button>'+
    '<button class="iconbtn2" id="lockBtn" aria-label="Verrouiller">'+svg(P.lock)+'</button></div></header>'+
    '<div class="nav" id="nav"></div><div id="body"></div>'+
    '<div class="addbar" id="addbar" style="display:none"><button class="add" id="addBtn">'+svg(P.plus)+'Ajouter un accès</button></div></div>';
  document.getElementById("lockBtn").onclick=function(){masterKey=null;accounts=[];revealed={};screen="unlock";render();};
  document.getElementById("exportBtn").onclick=exportVault;
  document.getElementById("addBtn").onclick=function(){openSheet(null);};
  renderInner();
}
function renderInner(){renderNav();if(view==="home")renderHome();else renderEntity(view);}

function renderNav(){
  var h='<button class="chip '+(view==="home"?"on":"")+'" data-nav="home">Accueil</button>';
  EORD.forEach(function(e){h+='<button class="chip '+(view===e?"on":"")+'" data-nav="'+e+'"><span class="dot" style="background:'+ENTITIES[e].color+'"></span>'+ENTITIES[e].name+'</button>';});
  var n=document.getElementById("nav");n.innerHTML=h;
  n.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){view=c.dataset.nav;renderInner();window.scrollTo(0,0);};});
}
function renderHome(){
  var h='<div class="tiles">';
  EORD.forEach(function(e){var en=ENTITIES[e];
    h+='<button class="tile" data-nav="'+e+'"><div class="ti" style="background:'+en.color+'1F;color:'+en.color+'">'+svg(P[en.tile])+'</div>'+
       '<h2 class="serif">'+esc(en.name)+'</h2><div class="tsub">'+esc(en.sub)+'</div>'+
       '<div class="cnt">'+count(e)+' accès '+svg(P.chev)+'</div></button>';
  });
  h+='</div>';
  document.getElementById("body").innerHTML=h;
  document.getElementById("addbar").style.display="none";
  document.querySelectorAll(".tile").forEach(function(t){t.onclick=function(){view=t.dataset.nav;renderInner();window.scrollTo(0,0);};});
}
function renderEntity(e){
  var en=ENTITIES[e];
  var rows=accounts.filter(function(a){return a.entity===e;}).sort(function(a,b){return (TORD.indexOf(a.type)-TORD.indexOf(b.type))||a.service.localeCompare(b.service);});
  var h='<div class="list"><div class="lhead"><h3 class="serif">'+esc(en.name)+' · '+esc(en.sub)+'</h3>'+(en.note?'<p class="note">À noter — '+esc(en.note)+'</p>':'')+'</div>';
  if(!rows.length){h+='<div style="text-align:center;color:var(--muted);font-size:14px;padding:32px 0">Aucun accès pour le moment.</div>';}
  h+=rows.map(function(a){var t=TYPES[a.type],show=revealed[a.id],wait=pending(a);
    return '<div class="card"><div class="top">'+
      '<div class="ibox" style="background:'+en.color+'1F;color:'+en.color+'">'+svg(P[t.icon])+'</div>'+
      '<div class="info"><div class="svcrow"><span class="svc">'+esc(a.service)+'</span>'+(wait?'<span class="wait">En attente</span>':'')+'</div><div class="ttag">'+t.label+'</div></div>'+
      '<button class="edit" data-act="edit" data-id="'+a.id+'">'+svg(P.pencil)+'</button></div>'+
      '<div class="rows">'+
        '<div class="r"><div class="lbl">Identifiant</div>'+(a.login?'<div class="val">'+esc(a.login)+'</div><button class="tap" data-act="copyl" data-id="'+a.id+'">'+(copied===a.id+"l"?'<span class="ok">'+svg(P.check)+'</span>':svg(P.copy))+'</button>':'<div class="val todo" data-act="edit" data-id="'+a.id+'">À renseigner</div>')+'</div>'+
        '<div class="r"><div class="lbl">Mot de passe</div>'+(a.password?'<div class="val mono">'+(show?esc(a.password):"••••••••••")+'</div><button class="tap" data-act="eye" data-id="'+a.id+'">'+svg(show?P.eyeOff:P.eye)+'</button><button class="tap" data-act="copyp" data-id="'+a.id+'">'+(copied===a.id+"p"?'<span class="ok">'+svg(P.check)+'</span>':svg(P.copy))+'</button>':'<div class="val todo" data-act="edit" data-id="'+a.id+'">À renseigner</div>')+'</div>'+
      '</div></div>';
  }).join("");
  h+='</div>';
  document.getElementById("body").innerHTML=h;
  document.getElementById("addbar").style.display="block";
  document.getElementById("body").onclick=function(ev){var t=ev.target.closest("[data-act]");if(!t)return;var id=t.dataset.id,act=t.dataset.act,a=accounts.find(function(x){return x.id===id;});
    if(act==="eye"){revealed[id]=!revealed[id];renderEntity(e);}
    else if(act==="copyl"){doCopy(a.login,id+"l");}
    else if(act==="copyp"){doCopy(a.password,id+"p");}
    else if(act==="edit"){openSheet(a);}
  };
}

// ————— Feuille ajout/édition —————
function openSheet(a){
  var isNew=!a;
  var f=a||{id:"",entity:(view!=="home"?view:"fundus"),type:"mail",service:"",login:"",password:"",url:"",note:""};
  var entOpts=EORD.map(function(e){return '<option value="'+e+'"'+(f.entity===e?" selected":"")+'>'+esc(ENTITIES[e].name)+'</option>';}).join("");
  var typeOpts=TORD.map(function(tp){return '<option value="'+tp+'"'+(f.type===tp?" selected":"")+'>'+TYPES[tp].label+'</option>';}).join("");
  function field(id,lbl,val,ph){return '<div class="f"><label>'+lbl+'</label><input class="field" id="'+id+'" value="'+esc(val)+'" placeholder="'+ph+'" /></div>';}
  var o=document.createElement("div");o.className="overlay";
  o.innerHTML='<div class="sheet"><div class="grab"></div><h3 class="serif">'+(isNew?"Nouvel accès":"Modifier l\'accès")+'</h3>'+
    '<div class="grid2"><div class="f"><label>Société</label><select class="field" id="s-entity">'+entOpts+'</select></div>'+
    '<div class="f"><label>Type</label><select class="field" id="s-type">'+typeOpts+'</select></div></div>'+
    field("s-service","Service",f.service,"Qonto, Pennylane, Instagram…")+
    field("s-login","Identifiant / email",f.login,"charles@…")+
    field("s-password","Mot de passe",f.password,"Chiffré à l'enregistrement")+
    field("s-url","Lien (optionnel)",f.url,"https://…")+
    '<div class="sheet-foot"><button class="btn-ghost" id="s-cancel">Annuler</button><button class="btn-accent" id="s-save">Enregistrer</button></div>'+
    (isNew?'':'<button class="del-link" id="s-del">Supprimer cet accès</button>')+'</div>';
  o.addEventListener("click",function(ev){if(ev.target===o)document.body.removeChild(o);});
  document.body.appendChild(o);
  document.getElementById("s-cancel").onclick=function(){document.body.removeChild(o);};
  document.getElementById("s-save").onclick=function(){
    var g=function(id){return document.getElementById(id).value;};
    var service=g("s-service").trim();if(!service)return;
    var rec={id:isNew?("n"+Date.now()):a.id,entity:g("s-entity"),type:g("s-type"),service:service,login:g("s-login").trim(),password:g("s-password"),url:g("s-url").trim(),note:a?a.note:""};
    var next=isNew?accounts.concat([rec]):accounts.map(function(x){return x.id===a.id?rec:x;});
    persist(next);document.body.removeChild(o);renderInner();
  };
  if(!isNew){document.getElementById("s-del").onclick=function(){if(confirm("Supprimer « "+a.service+" » ?")){persist(accounts.filter(function(x){return x.id!==a.id;}));document.body.removeChild(o);renderInner();}};}
}

// ————— Rendu principal —————
function render(){
  if(screen==="loading"){root.innerHTML='<div class="gate"><p style="color:var(--muted)">Ouverture…</p></div>';return;}
  if(screen==="setup"){renderGate("setup");return;}
  if(screen==="unlock"){renderGate("unlock");return;}
  mountApp();
}
function exportVault(){var raw=localStorage.getItem(STORE_KEY);if(!raw)return;var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([raw],{type:"application/json"}));a.download="porteclefs-"+new Date().toISOString().slice(0,10)+".vault";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);}

(function init(){var raw=localStorage.getItem(STORE_KEY);if(raw){try{stored=JSON.parse(raw);screen="unlock";}catch(e){screen="setup";}}else screen="setup";render();})();
</script>
